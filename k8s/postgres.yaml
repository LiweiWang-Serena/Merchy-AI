apiVersion: v1
kind: Secret
metadata: { name: merchy-secrets }
stringData:
  POSTGRES_PASSWORD: devpassword
  DATABASE_URL: postgresql://postgres:devpassword@postgres:5432/merchy
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: pgdata }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
      - name: postgres
        image: pgvector/pgvector:pg16
        env:
        - { name: POSTGRES_DB, value: merchy }
        - name: POSTGRES_PASSWORD
          valueFrom: { secretKeyRef: { name: merchy-secrets, key: POSTGRES_PASSWORD } }
        ports: [{ containerPort: 5432 }]
        volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
        readinessProbe:
          exec: { command: ["pg_isready","-U","postgres"] }
          initialDelaySeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim: { claimName: pgdata }
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
