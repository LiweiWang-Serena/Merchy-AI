name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sqlite:
    name: pytest (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend

  postgres:
    name: pytest (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: merchy
          POSTGRES_PASSWORD: merchy
          POSTGRES_DB: channel_ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U merchy -d channel_ledger_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://merchy:merchy@localhost:5432/channel_ledger_test

  docker:
    name: docker compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp backend/.env.example backend/.env
      - run: docker compose up -d --build
      - name: Wait for the app to respond
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5050/ >/dev/null 2>&1; then
              echo "app is up"; exit 0
            fi
            sleep 2
          done
          echo "app did not start"; docker compose logs; exit 1
      - if: always()
        run: docker compose down
