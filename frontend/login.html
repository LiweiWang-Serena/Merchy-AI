<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign in — SkuTrail</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/ops.css">
<style>
  .signin { max-width: 380px; margin: 14vh auto 0; padding: 0 24px; }
  .signin h1 { font: 600 30px/1.15 var(--serif); margin: 0 0 8px; }
  .signin p { color: var(--dim); margin: 0 0 28px; }
  .signin input {
    width: 100%; padding: 11px 12px; border: 1px solid var(--rule); border-radius: 3px;
    font: 500 15px var(--sans); background: #fff; color: var(--ink);
  }
  .signin input:focus { outline: none; border-color: var(--ink); }
  .signin label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
  .signin button { width: 100%; margin-top: 16px; padding: 12px; }
  .signin .back { display: inline-block; margin-top: 28px; font-size: 13.5px; color: var(--dim); }
</style>
</head>
<body>
<main class="signin">
  <h1>SkuTrail</h1>
  <p>Sign in to manage inventory, listings and reports.</p>
  <label for="password">Admin password</label>
  <input id="password" type="password" autocomplete="current-password" autofocus>
  <button class="primary" id="signin" type="button">Sign in</button>
  <div class="msg" id="msg" aria-live="polite"></div>
  <p class="hint" style="margin-top: 18px">
    The password is set by ADMIN_PASSWORD in backend/.env. If you haven't set one, the terminal
    running the server shows the password for this run.
  </p>
  <a class="back" href="/">Back to the store</a>
</main>
<script>
// Only return to pages inside the admin area, so the link can't send
// someone to another site after signing in.
const next = new URLSearchParams(location.search).get("next");
const destination = next && next.startsWith("/admin") && !next.startsWith("//") ? next : "/admin";

async function signIn() {
  const msg = document.getElementById("msg");
  const password = document.getElementById("password").value;
  if (!password) {
    msg.className = "msg error";
    msg.textContent = "Enter the admin password.";
    return;
  }
  document.getElementById("signin").disabled = true;
  try {
    const res = await fetch("/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Sign-in failed.");
    location.href = destination;
  } catch (e) {
    msg.className = "msg error";
    msg.textContent = e.message === "Failed to fetch"
      ? "The server isn't responding. Start it with `python app.py`, then try again."
      : e.message;
    document.getElementById("signin").disabled = false;
  }
}
document.getElementById("signin").onclick = signIn;
document.getElementById("password").onkeydown = e => { if (e.key === "Enter") signIn(); };
</script>
</body>
</html>
